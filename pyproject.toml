[project]
name = "autocalls"
version = "0.1.0"
description = "Automated voice AI testing - call your bots, follow flows, verify stability"
requires-python = ">=3.11"
dependencies = [
    "twilio>=9.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=12.0",
    "deepgram-sdk>=3.4",
    "anthropic>=0.40",
    "typer>=0.9",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "aiosqlite>=0.19",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.scripts]
autocalls = "autocalls.cli:app"

[tool.setuptools.packages.find]
include = ["autocalls*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
