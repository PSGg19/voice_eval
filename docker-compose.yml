# Local stack. `docker compose up -d` gives you the core: Redis.
#
# Postgres is the database and is NOT optional — but on this machine it is the
# NATIVE server (Homebrew, port 5432, shared with the local OSV stack), not a
# container, so the developer's existing SQL tooling sees vjudge's data with
# zero extra setup. The app connects via VJUDGE_DATABASE_URL (default
# postgres:root@localhost:5432/vjudge) and owns ONLY the `vjudge` database
# there. The `postgres` service below is internal plumbing for the tracing
# profile (Phoenix/Langfuse need their own store and must not write into the
# OSV server); it exposes no host port.
#
# There is deliberately no SQLite fallback and no in-memory queue: maintaining
# a second storage implementation forever is a worse cost than running one
# container and one native server.
#
# Observability IS a choice, so it sits behind compose profiles — nothing starts
# unless you ask for it:
#
#   docker compose up -d                          core only
#   docker compose --profile tracing up -d        + Phoenix and Langfuse
#   docker compose --profile logs up -d           + Loki and Grafana
#   docker compose --profile storage up -d        + MinIO (S3-compatible)
#   docker compose --profile all up -d            everything
#
# Artifacts — transcripts, model-call logs, recordings — default to the local
# filesystem, which is right while a run and whoever reads its results are the
# same machine. That stops being true the moment the UI serves them: the API is
# then a different process from the worker that wrote the file. MinIO is here so
# that switch is a config change and not a migration, and so the S3 path can be
# exercised locally before it matters.

name: vjudge

services:
  # ----------------------------------------------- tracing-internal postgres
  # NOT the app's database (that is the native server — see header). This one
  # exists only so Phoenix and Langfuse have a store of their own; it joins
  # the compose network under the `tracing`/`all` profiles and publishes no
  # host port, so it can never be dialled by mistake.
  postgres:
    image: postgres:16-alpine
    profiles: ["tracing", "all"]
    environment:
      POSTGRES_USER: vjudge
      POSTGRES_PASSWORD: vjudge
      POSTGRES_DB: vjudge
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vjudge -d vjudge"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the phoenix and langfuse databases and exits. Without this the
  # tracing services point at databases that never exist and fail to boot,
  # which reads like an image problem and is not. Idempotent.
  postgres-init:
    image: postgres:16-alpine
    profiles: ["tracing", "all"]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGPASSWORD: vjudge
    entrypoint: >
      /bin/sh -c "
      psql -h postgres -U vjudge -d vjudge -tc \"SELECT 1 FROM pg_database WHERE datname='phoenix'\" | grep -q 1 || psql -h postgres -U vjudge -d vjudge -c 'CREATE DATABASE phoenix' &&
      psql -h postgres -U vjudge -d vjudge -tc \"SELECT 1 FROM pg_database WHERE datname='langfuse'\" | grep -q 1 || psql -h postgres -U vjudge -d vjudge -c 'CREATE DATABASE langfuse' &&
      echo 'databases ready: phoenix, langfuse'
      "

  # ---------------------------------------------------------------- core
  redis:
    image: redis:7-alpine
    # appendonly so a restart does not silently drop queued runs in local dev,
    # which otherwise looks like a bug in the harness.
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------- tracing (opt-in)
  phoenix:
    image: arizephoenix/phoenix:latest
    profiles: ["tracing", "all"]
    ports:
      - "6006:6006"   # UI and OTLP/HTTP
      - "4317:4317"   # OTLP/gRPC
    environment:
      # SQLite is Phoenix's default and serialises writes; point it at Postgres
      # so local traces survive a restart and can take a burst.
      PHOENIX_SQL_DATABASE_URL: postgresql://vjudge:vjudge@postgres:5432/phoenix
    depends_on:
      postgres-init: {condition: service_completed_successfully}

  # Langfuse v3 is a SET: web + worker + ClickHouse (traces live there, not in
  # Postgres) + S3-compatible blob storage (MinIO) + Redis. Heavier than
  # Phoenix's single container — that asymmetry is itself a data point for the
  # tracing-backend choice. All of it stays behind the tracing profile.
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    profiles: ["tracing", "all"]
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes: ["clickhousedata:/var/lib/clickhouse"]
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user clickhouse --password clickhouse --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20

  langfuse:
    image: langfuse/langfuse:3
    profiles: ["tracing", "all"]
    # Host 3200, not 3000: this machine's llm-studio frontend dev server owns
    # 3000. LANGFUSE_HOST must match (see .env.local.example).
    ports: ["3200:3000"]
    environment: &langfuse-env
      DATABASE_URL: postgresql://vjudge:vjudge@postgres:5432/langfuse
      NEXTAUTH_SECRET: local-dev-only-not-a-secret
      SALT: local-dev-only-not-a-secret
      # Local-dev constant, deliberately committed — encrypts nothing that
      # matters on a laptop. Generate a real one for anything shared.
      ENCRYPTION_KEY: "0d3762d33e33427eaeeb76a3e1f88b31e2f7192cd5f6c69dd53db43a1a4cd7f0"
      NEXTAUTH_URL: http://localhost:3200
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: vjudge
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: vjudge-local-only
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      # First-boot provisioning: org, project and API keys exist without any
      # manual signup. These are the keys .env.local.example references.
      LANGFUSE_INIT_ORG_ID: vjudge
      LANGFUSE_INIT_ORG_NAME: VJudge
      LANGFUSE_INIT_PROJECT_ID: vjudge-local
      LANGFUSE_INIT_PROJECT_NAME: vjudge-local
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-vjudge-local
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-vjudge-local
      LANGFUSE_INIT_USER_EMAIL: dev@local.test
      LANGFUSE_INIT_USER_NAME: dev
      LANGFUSE_INIT_USER_PASSWORD: vjudge-local
    depends_on:
      postgres-init: {condition: service_completed_successfully}
      clickhouse: {condition: service_healthy}
      minio: {condition: service_healthy}
      redis: {condition: service_healthy}

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    profiles: ["tracing", "all"]
    environment: *langfuse-env
    depends_on:
      postgres-init: {condition: service_completed_successfully}
      clickhouse: {condition: service_healthy}
      minio: {condition: service_healthy}
      redis: {condition: service_healthy}

  # ---------------------------------------------------------- logs (opt-in)
  loki:
    image: grafana/loki:3.0.0
    profiles: ["logs", "all"]
    ports: ["3100:3100"]
    command: ["-config.file=/etc/loki/local-config.yaml"]

  grafana:
    image: grafana/grafana:latest
    profiles: ["logs", "all"]
    ports: ["3001:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    depends_on: [loki]

  # ------------------------------------------------------- storage (opt-in)
  minio:
    image: minio/minio:latest
    # In the tracing profile too: Langfuse v3 requires S3-compatible event
    # storage, and MinIO is already the local answer to that.
    profiles: ["storage", "tracing", "all"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: vjudge
      MINIO_ROOT_PASSWORD: vjudge-local-only
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket and exits. Without this the first write fails on a
  # missing bucket, which reads like a credentials problem and is not.
  minio-init:
    image: minio/mc:latest
    profiles: ["storage", "tracing", "all"]
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 vjudge vjudge-local-only &&
      mc mb --ignore-existing local/vjudge-artifacts &&
      mc mb --ignore-existing local/langfuse &&
      echo 'buckets ready: vjudge-artifacts, langfuse'
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
  clickhousedata:
